<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Habla con tus documentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: workshop-guide shell — sticky top bar, module rail on the left, one readable column; code panels stay dark in both themes */
:root{
  --bg:#F7F5FB; --surface:#FFFFFF; --surface-2:#EFEAF8; --line:#E2DCEF;
  --fg:#1C1A29; --muted:#5E5A72; --accent:#6B32D6; --accent-ink:#FFFFFF; --accent-soft:#EAE2FB;
  --ok:#0F7A6C; --ok-soft:#DDF3EF; --warn:#8F4210; --warn-soft:#FFF1E4; --warn-line:#E8B48A;
  --code-bg:#161C28; --code-fg:#E6E3EF; --code-muted:#8C93A8; --code-line:#2A3346;
  --c-kw:#C9A8FF; --c-str:#5EE0CB; --c-num:#F5B97A; --c-com:#7D879C; --c-fn:#9CC2FF;
  --f-display:'Space Grotesk', 'Trebuchet MS', Arial, sans-serif;
  --f-body:'DM Sans', 'Segoe UI', Arial, sans-serif;
  --f-mono:'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
  --radius:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121822; --surface:#19212E; --surface-2:#232D3F; --line:#2D384C;
  --fg:#ECE9F4; --muted:#A6A1BA; --accent:#B98CFF; --accent-ink:#1A1230; --accent-soft:#2A2147;
  --ok:#45D3BF; --ok-soft:#173A36; --warn:#F3AE72; --warn-soft:#33241A; --warn-line:#7A4A26;
  --code-bg:#0D121A; --code-line:#253045; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121822; --surface:#19212E; --surface-2:#232D3F; --line:#2D384C;
  --fg:#ECE9F4; --muted:#A6A1BA; --accent:#B98CFF; --accent-ink:#1A1230; --accent-soft:#2A2147;
  --ok:#45D3BF; --ok-soft:#173A36; --warn:#F3AE72; --warn-soft:#33241A; --warn-line:#7A4A26;
  --code-bg:#0D121A; --code-line:#253045; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:3px}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code{font-family:var(--f-mono);font-size:.86em;background:var(--surface-2);padding:.12em .38em;border-radius:6px;overflow-wrap:anywhere}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:16px;
  padding:12px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0;text-decoration:none;color:var(--fg)}
.hex{width:34px;height:38px;flex:none}
.brand>span{min-width:0;overflow:hidden}
.brand b{display:block;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.spacer{flex:1}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);white-space:nowrap}
.bar{width:120px;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
.menu-btn{display:none;font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:6px 14px;cursor:pointer}

/* shell */
.shell{display:grid;grid-template-columns:290px minmax(0,1fr);max-width:1240px;margin-inline:auto}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 63px);align-self:start;max-height:calc(100vh - 63px);overflow:auto;padding:28px 20px 40px;border-right:1px solid var(--line)}
.rail h4{font-family:var(--f-body);font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 10px 8px}
.rail h4:first-child{margin-top:0}
.rail a{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;color:var(--fg);text-decoration:none;font-size:14.5px;line-height:1.3}
.rail a:hover{background:var(--surface-2)}
.rail a[aria-current="page"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.rail a.sub{padding-left:44px;grid-template-columns:1fr auto;font-size:13.5px;color:var(--muted)}
.rail a.sub[aria-current="page"]{color:var(--fg)}
.num{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center;border:1px solid var(--line);border-radius:6px;padding:1px 0;background:var(--surface)}
.rail a.done .num{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.mins{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rail .total{margin:18px 10px 0;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;justify-content:space-between}

/* article */
main{min-width:0;padding:44px clamp(16px,5vw,64px) 80px}
article{max-width:740px}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{font-size:12.5px;font-weight:600;letter-spacing:.04em;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.chip.mod{background:var(--accent);color:var(--accent-ink)}
.chip.hands{background:var(--ok-soft);color:var(--ok)}
.chip.must{background:var(--warn-soft);color:var(--warn)}
h1.page-title{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,4.4vw,44px);line-height:1.08;letter-spacing:-.025em;margin:0 0 28px;text-wrap:balance}
article h2{font-family:var(--f-display);font-size:25px;font-weight:700;letter-spacing:-.015em;line-height:1.2;margin:44px 0 12px;text-wrap:balance}
article h3{font-family:var(--f-display);font-size:19px;font-weight:700;margin:30px 0 8px}
article p,article li{max-width:68ch}
article ul,article ol{padding-left:1.3em}
article li{margin:4px 0}
article hr{border:0;border-top:1px solid var(--line);margin:36px 0}
article img{border-radius:var(--radius);border:1px solid var(--line);display:block}
.dead{color:inherit;text-decoration:none;pointer-events:none}

.tablewrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface-2)}
tr:last-child td{border-bottom:0}

.callout{margin:18px 0;padding:14px 18px;border-radius:var(--radius);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.callout p{margin:0}
.callout.warn{background:var(--warn-soft);border-color:var(--warn-line)}
.callout.warn strong{color:var(--warn)}

.code{position:relative;margin:14px 0;border-radius:var(--radius);background:var(--code-bg);border:1px solid var(--code-line);overflow:hidden}
.code::before{content:attr(data-lang);display:block;padding:8px 14px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--code-muted);border-bottom:1px solid var(--code-line);font-family:var(--f-body);font-weight:600}
.code pre{margin:0;padding:14px 16px 16px;overflow-x:auto;font-family:var(--f-mono);font-size:13.5px;line-height:1.6;color:var(--code-fg)}
.copy{position:absolute;top:5px;right:6px;font:600 12px var(--f-body);color:var(--code-fg);background:transparent;border:1px solid var(--code-line);border-radius:7px;padding:3px 10px;cursor:pointer}
.copy:hover{background:var(--code-line)}
.copy.ok{color:var(--c-str);border-color:var(--c-str)}
.hl .k,.hl .kn,.hl .kd,.hl .kc,.hl .ow,.hl .nb{color:var(--c-kw)}
.hl .s,.hl .s1,.hl .s2,.hl .sd,.hl .si,.hl .se,.hl .sa,.hl .nt{color:var(--c-str)}
.hl .m,.hl .mi,.hl .mf,.hl .kt{color:var(--c-num)}
.hl .c,.hl .c1,.hl .cm,.hl .ch,.hl .cs{color:var(--c-com);font-style:italic}
.hl .nf,.hl .fm,.hl .nv{color:var(--c-fn)}
.hl .p,.hl .o,.hl .n,.hl .w{color:var(--code-fg)}

figure.diagram{margin:20px 0;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto}
figure.diagram svg{display:block;margin:auto;height:auto;min-width:520px}

details{margin:14px 0;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
details>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style-position:inside}
details[open]>summary{border-bottom:1px solid var(--line)}
details>*:not(summary){margin-inline:16px}
details .code{margin-inline:16px}
details.file>summary code{background:transparent;padding:0;font-size:14px}
details.file .code{margin:14px 16px}
.docprev{padding:4px 0;font-size:15px}
.docprev h1{font-family:var(--f-display);font-size:22px;margin:14px 0 6px}
.docprev h2{font-size:18px;margin:22px 0 6px}
.docprev h3{font-size:16px;margin:16px 0 4px}
.metalabel{font-size:13px;color:var(--muted);margin:10px 16px 0}

ul.tasks{list-style:none;padding:0;margin:14px 0;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
li.task{margin:0;border-bottom:1px solid var(--line)}
li.task:last-child{border-bottom:0}
li.task label{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;cursor:pointer}
li.task input{width:18px;height:18px;margin-top:3px;accent-color:var(--ok);flex:none}
li.task input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:48px;padding-top:24px;border-top:1px solid var(--line);max-width:740px}
.pager a{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;color:var(--fg);background:var(--surface);min-width:0}
.pager a:hover{border-color:var(--accent)}
.pager small{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.pager .next{text-align:right;grid-column:2}
.donebox{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:40px;padding:16px 18px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);max-width:740px}
.donebox p{margin:0;flex:1;min-width:200px;color:var(--muted);font-size:15px}
.done-btn{font:600 15px var(--f-body);padding:9px 18px;border-radius:99px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.done-btn[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.rail{position:fixed;inset:calc(env(safe-area-inset-top,0px) + 62px) 0 0 0;max-height:none;background:var(--bg);z-index:15;border-right:0}
  .menu-btn{display:inline-block}
  .bar{width:64px}
  main{padding-top:28px}
}
@media (max-width:520px){ .progress{display:none} .brand small{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

e class=\"callout tip\">\n<p>Taller pr\u00e1ctico de <strong>2 horas<\/strong> del <strong>AWS User Group C\u00e1rdenas<\/strong>.\nAprende desde cero a construir un asistente que responde preguntas sobre <strong>tus propios documentos<\/strong> y <strong>cita sus fuentes<\/strong>.<\/p>\n<\/aside>\n<hr />\n<h2>\u00bfQu\u00e9 vas a construir?<\/h2>\n<p>Un asistente de preguntas y respuestas sobre los documentos internos de <strong>Cacao Labs<\/strong>, una startup ficticia de C\u00e1rdenas, Tabasco. Al terminar, podr\u00e1s preguntarle cosas como:<\/p>\n<ul>\n<li><em>\"\u00bfCu\u00e1ntos d\u00edas de vacaciones tengo en mi primer a\u00f1o?\"<\/em><\/li>\n<li><em>\"\u00bfC\u00f3mo pido un reembolso de gastos de viaje?\"<\/em><\/li>\n<li><em>\"\u00bfQu\u00e9 hago si pierdo mi laptop de la empresa?\"<\/em><\/li>\n<\/ul>\n<p>El asistente te contestar\u00e1 <strong>usando solo la informaci\u00f3n de los documentos<\/strong> y te dir\u00e1 <strong>de qu\u00e9 archivo sac\u00f3 cada dato<\/strong>.<\/p>\n<figure class=\"diagram\"><svg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"0 0 1713.28125 187.9320068359375\" style=\"max-width: 1713.28125px;\" class=\"flowchart\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"mmd0\"><style>#mmd0{font-family:DM Sans,sans-serif;font-size:15px;fill:var(--fg);}#mmd0 .error-icon{fill:var(--surface-2);}#mmd0 .error-text{fill:var(--muted);stroke:var(--muted);}#mmd0 .edge-thickness-normal{stroke-width:1px;}#mmd0 .edge-thickness-thick{stroke-width:3.5px;}#mmd0 .edge-pattern-solid{stroke-dasharray:0;}#mmd0 .edge-thickness-invisible{stroke-width:0;fill:none;}#mmd0 .edge-pattern-dashed{stroke-dasharray:3;}#mmd0 .edge-pattern-dotted{stroke-dasharray:2;}#mmd0 .marker{fill:var(--muted);stroke:var(--muted);}#mmd0 .marker.cross{stroke:var(--muted);}#mmd0 svg{font-family:DM Sans,sans-serif;font-size:15px;}#mmd0 p{margin:0;}#mmd0 .label{font-family:DM Sans,sans-serif;color:var(--fg);}#mmd0 .cluster-label t ign: center;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\"><p>\ud83e\udd16 Amazon Nova<\/p><\/span><\/div><\/foreignObject><\/g><\/g><g transform=\"translate(1627.8359375, 102.4320068359375)\" id=\"flowchart-R-11\" class=\"node default\"><rect height=\"52.5\" width=\"154.890625\" y=\"-26.25\" x=\"-77.4453125\" style=\"\" class=\"basic label-container\"><\/rect><g transform=\"translate(-47.4453125, -11.25)\" style=\"\" class=\"label\"><rect><\/rect><foreignObject height=\"22.5\" width=\"94.890625\"><div style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\" xmlns=\"http://www.w3.org/1999/xhtml\"><span class=\"nodeLabel\"><p>\u2705 Respuesta<\/p><\/span><\/div><\/foreignObject><\/g><\/g><\/g><\/g><\/g><\/svg><\/figure>\n<h2>C\u00f3mo est\u00e1 organizado<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>M\u00f3dulo<\/th>\n<th>Tiempo<\/th>\n<th>Tipo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td><a href=\"#prerrequisitos\" data-nav>Prerrequisitos y entorno<\/a><\/td>\n<td>10 min<\/td>\n<td>Setup<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td><a href=\"#conceptos\" data-nav>Conceptos: \u00bfqu\u00e9 es RAG?<\/a><\/td>\n<td>15 min<\/td>\n<td>Teor\u00eda<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><a href=\"#datos\" data-nav>Prepara tus datos en S3<\/a><\/td>\n<td>10 min<\/td>\n<td>\ud83d\udee0\ufe0f Hands-on<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><a href=\"#crear-kb\" data-nav>Crea tu Knowledge Base<\/a><\/td>\n<td>20 min<\/td>\n<td>\ud83d\udee0\ufe0f Hands-on<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><a href=\"#consola\" data-nav>Pru\u00e9bala en la consola<\/a><\/td>\n<td>15 min<\/td>\n<td>\ud83d\udee0\ufe0f Hands-on<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><a href=\"#python\" data-nav>Cons\u00faltala con Python<\/a><\/td>\n<td>25 min<\/td>\n<td>\ud83d\udee0\ufe0f Hands-on<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><a href=\"#retos\" data-nav>Retos: ajusta y mejora<\/a><\/td>\n<td>15 min<\/td>\n<td>\ud83c\udfc6 Reto<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td><a href=\"#limpieza\" data-nav>Limpieza de recursos<\/a><\/td>\n<td>5 min<\/td>\n<td>\u26a0\ufe0f Obligatorio<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td><a href=\"#que-sigue\" data-nav>\u00bfQu\u00e9 sigue?<\/a><\/td>\n<td>5 min<\/td>\n<td>Cierre<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>\u00bfAlgo fall\u00f3? Revisa <a href=\"#troubleshooting\" data-nav>Soluci\u00f3n de problemas<\/a>.\n\u00bfVas a impartir el taller? Lee la <a href=\"#instructor\" data-nav>Gu\u00eda del instructor<\/a>.<\/p>\n<h2>Requisitos<\/h2>\n<ul>\n<li>Laptop con navegador actualizado (Chrome, Edge o Firefox).<\/li>\n<li>Acceso a una cuenta de AWS. Puede ser:<\/li>\n<li><strong>Cuenta de evento<\/strong> que te da el instructor (no pagas nada), o<\/li>\n<li><strong>Tu propia cuenta<\/strong> (el costo estimado es <strong>menor a 1 USD<\/strong> si haces la <a href=\"#limpieza\" data-nav>limpieza<\/a>).<\/li>\n<li>Python b\u00e1sico (deseable, no obligatorio). Todo el c\u00f3digo ya est\u00e1 escrito y lo vas a ejecutar en <strong>AWS CloudShell<\/strong>, as\u00ed que <strong>no necesitas instalar nada<\/strong>.<\/li>\n<\/ul>\n<h2>Servicios que vas a usar<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Servicio<\/th>\n<th>Para qu\u00e9<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Amazon S3<\/strong><\/td>\n<td>Guardar los documentos fuente<\/td>\n<\/tr>\n<tr>\n<td><strong>Amazon Bedrock Knowledge Bases<\/strong><\/td>\n<td>Orquestar todo el flujo de RAG<\/td>\n<\/tr>\n<tr>\n<td><strong>Amazon Titan Text Embeddings V2<\/strong><\/td>\n<td>Convertir texto en vectores<\/td>\n<\/tr>\n<tr>\n<td><strong>Amazon S3 Vectors<\/strong><\/td>\n<td>Guardar y buscar los vectores<\/td>\n<\/tr>\n<tr>\n<td><strong>Amazon Nova 2 Lite<\/strong><\/td>\n<td>Generar la respuesta final<\/td>\n<\/tr>\n<tr>\n<td><strong>AWS CloudShell<\/strong><\/td>\n<td>Terminal en el navegador con Python y boto3<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Estructura del repositorio<\/h2>\n<div class=\"code\" data-lang=\"Texto\"><div class=\"hl\"><pre><span><\/span>.\n\u251c\u2500\u2500 README.md                 \u2190 est\u00e1s aqu\u00ed\n\u251c\u2500\u2500 docs/                     \u2190 paso a paso del taller\n\u251c\u2500\u2500 data/                     \u2190 documentos de ejemplo de &quot;Cacao Labs&quot;\n\u2502   \u2514\u2500\u2500 extra/                \u2190 documento para el reto de re-sincronizaci\u00f3n\n\u251c\u2500\u2500 scripts/                  \u2190 scripts de Python para el m\u00f3dulo 5\n\u251c\u2500\u2500 site/index.html           \u2190 esta misma gu\u00eda como p\u00e1gina web interactiva\n\u2514\u2500\u2500 slides/                   \u2190 presentaci\u00f3n del taller en PDF\n<\/pre><\/div>\n<\/div>\n<aside class=\"callout tip\">\n<p>\ud83c\udf10 <strong>Versi\u00f3n web:<\/strong> activa GitHub Pages en <em>Settings \u2192 Pages<\/em> con la carpeta <code>/site<\/code> (o copia <code>site/index.html<\/code> a la ra\u00edz de la rama <code>gh-pages<\/code>). La p\u00e1gina incluye navegaci\u00f3n por m\u00f3dulos, botones para copiar c\u00f3digo y una lista de progreso que se guarda en tu navegador.<\/p>\n<\/aside>\n<h2>Cr\u00e9ditos y licencia<\/h2>\n<p>Creado por <strong>AWS User Group C\u00e1rdenas<\/strong> con el apoyo de <strong>XpectreLabs Comunidad<\/strong>.\nEl formato est\u00e1 inspirado en los workshops oficiales de <a href=\"https://workshops.aws/\" target=\"_blank\" rel=\"noopener\">AWS Workshop Studio<\/a>.<\/p>\n<p>Contenido bajo licencia <a class=\"dead\">MIT<\/a>. Cacao Labs es una empresa ficticia. Cualquier parecido con la realidad es coincidencia.<\/p>\n<aside class=\"callout warn\">\n<p>\u26a0\ufe0f Este no es material oficial de Amazon Web Services. AWS y Amazon Bedrock son marcas de Amazon.com, Inc. o sus afiliadas.<\/p>\n<\/aside>"}, {"id": "prerrequisitos", "group": "Taller", "label": "Prerrequisitos y entorno", "num": "0", "mins": 10, "kind": "Setup", "title": "0 \u00b7 Prerrequisitos y entorno", "html": "<p>Antes de empezar necesitas una cuenta de AWS y una terminal en la nube. Elige <strong>una<\/strong> de estas dos rutas:<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>\ud83c\udf9f\ufe0f En el evento<\/th>\n<th>\ud83c\udfe0 Por tu cuenta<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\u00bfQui\u00e9n lo usa?<\/td>\n<td>Asistentes presenciales que recibieron un c\u00f3digo<\/td>\n<td>Cualquier persona, en cualquier momento<\/td>\n<\/tr>\n<tr>\n<td>Cuenta de AWS<\/td>\n<td>Temporal, la da el instructor<\/td>\n<td>La tuya<\/td>\n<\/tr>\n<tr>\n<td>Costo<\/td>\n<td>$0<\/td>\n<td>Menos de 1 USD si haces la limpieza<\/td>\n<\/tr>\n<tr>\n<td>Gu\u00eda<\/td>\n<td><a href=\"#evento\" data-nav>Configuraci\u00f3n en el evento<\/a><\/td>\n<td><a href=\"#cuenta-propia\" data-nav>Configuraci\u00f3n con tu cuenta<\/a><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Cuando termines tu ruta, regresa aqu\u00ed y haz la verificaci\u00f3n final.<\/p>\n<hr />\n<h2>\u2705 Verificaci\u00f3n final (las dos rutas)<\/h2>\n<h3>1. Confirma la regi\u00f3n<\/h3>\n<p>Arriba a la derecha de la consola de AWS, selecciona <strong>US East (N. Virginia) <code>us-east-1<\/code><\/strong>.<\/p>\n<aside class=\"callout tip\">\n<p>\ud83d\udca1 Usa la misma regi\u00f3n durante <strong>todo<\/strong> el taller. La mayor\u00eda de los errores de \"no encuentro mi recurso\" vienen de cambiar de regi\u00f3n sin darte cuenta.<\/p>\n<\/aside>\n<h3>2. Abre AWS CloudShell<\/h3>\n<ol>\n<li>En la barra superior de la consola, haz clic en el \u00edcono de terminal <strong><code>&gt;_<\/code><\/strong> (CloudShell).<\/li>\n<li>Espera a que cargue (la primera vez tarda ~1 minuto).<\/li>\n<\/ol>\n<p>CloudShell es una terminal Linux dentro del navegador que ya trae <strong>Python 3<\/strong>, <strong>boto3<\/strong> y la <strong>AWS CLI<\/strong> configurados con tus credenciales. No tienes que instalar nada.<\/p>\n<h3>3. Descarga el material del taller<\/h3>\n<p>En CloudShell, ejecuta:<\/p>\n<div class=\"code\" data-lang=\"Terminal\"><div class=\"hl\"><pre><span><\/span>git<span class=\"w\"> <\/span>clone<span class=\"w\"> <\/span>https://github.com/&lt;ORG&gt;/taller-rag-bedrock.git\n<span class=\"nb\">cd<\/span><span class=\"w\"> <\/span>taller-rag-bedrock\nls\n<\/pre><\/div>\n<\/div>\n<p>Debes ver las carpetas <code>data/<\/code>, <code>docs/<\/code> y <code>scripts/<\/code>.<\/p>\n<h3>4. Verifica que tienes acceso a los modelos<\/h3>\n<div class=\"code\" data-lang=\"Terminal\"><div class=\"hl\"><pre><span><\/span>aws<span class=\"w\"> <\/span>bedrock<span class=\"w\"> <\/span>list-foundation-models<span class=\"w\"> <\/span><span class=\"se\">\\<\/span>\n<span class=\"w\">  <\/span>--region<span class=\"w\"> <\/span>us-east-1<span class=\"w\"> <\/span><span class=\"se\">\\<\/span>\n<span class=\"w\">  <\/span>--query<span class=\"w\"> <\/span><span class=\"s2\">&quot;modelSummaries[?modelId==&#39;amazon.titan-embed-text-v2:0&#39; || modelId==&#39;amazon.nova-2-lite-v1:0&#39;].modelId&quot;<\/span><span class=\"w\"> <\/span><span class=\"se\">\\<\/span>\n<span class=\"w\">  <\/span>--output<span class=\"w\"> <\/span>table\n<\/pre><\/div>\n<\/div>\n<p>Debes ver los dos modelos en la tabla:<\/p>\n<ul>\n<li><code>amazon.titan-embed-text-v2:0<\/code> \u2192 convierte texto en vectores (embeddings).<\/li>\n<li><code>amazon.nova-2-lite-v1:0<\/code> \u2192 genera las respuestas.<\/li>\n<\/ul>\n<aside class=\"callout tip\">\n<p>\ud83d\udca1 En Amazon Bedrock, los modelos serverless se habilitan autom\u00e1ticamente la primera vez que los usas. Ya no hay que pedir acceso modelo por modelo, salvo en casos especiales (ver <a href=\"#troubleshooting\" data-nav>Soluci\u00f3n de problemas<\/a>).<\/p>\n<\/aside>"}, {"id": "evento", "group": "sub", "label": "Ruta: en el evento", "num": null, "mins": null, "kind": null, "title": "\ud83c\udf9f\ufe0f Configuraci\u00f3n en el evento", "html": "<p>Usa esta ruta si est\u00e1s en el taller presencial y el instructor te dio un <strong>c\u00f3digo de acceso<\/strong> (<em>event access code<\/em>).<\/p>\n<h2>Pasos<\/h2>\n<ol>\n<li>Abre <strong>https://catalog.workshops.aws/join<\/strong> en tu navegador.<\/li>\n<li>Inicia sesi\u00f3n con la opci\u00f3n que indique el instructor. Por ejemplo, un <strong>c\u00f3digo de un solo uso enviado a tu correo<\/strong> o tu <strong>AWS Builder ID<\/strong> (la misma cuenta que usaste para registrarte al evento en Builder Center).<\/li>\n<li>Escribe el <strong>c\u00f3digo de acceso<\/strong> que aparece en la pantalla del instructor.<\/li>\n<li>Acepta los t\u00e9rminos y condiciones del evento.<\/li>\n<li>En el panel izquierdo, haz clic en <strong>Open AWS console<\/strong> (o <em>AWS account access<\/em> \u2192 <em>Open AWS console<\/em>).<\/li>\n<\/ol>\n<p>Se abre la consola de AWS de una cuenta temporal creada solo para ti.<\/p>\n<h2>Lo que debes saber<\/h2>\n<ul>\n<li>\u2705 La cuenta es <strong>gratuita<\/strong> para ti y <strong>se elimina autom\u00e1ticamente<\/strong> cuando termina el evento.<\/li>\n<li>\u2705 Los permisos ya est\u00e1n configurados para este taller.<\/li>\n<li>\u26a0\ufe0f Algunos servicios pueden estar bloqueados. Si ves un error de permisos en algo que <strong>no<\/strong> est\u00e1 en la gu\u00eda, es normal.<\/li>\n<li>\u26a0\ufe0f <strong>No guardes nada importante<\/strong> en la cuenta: se borra al final.<\/li>\n<li>\ud83d\udcbe Si quieres conservar lo que hiciste, copia tus scripts o haz <em>fork<\/em> del repositorio en tu GitHub.<\/li>\n<\/ul>\n<p>Como la cuenta se borra sola, en esta ruta <strong>no es obligatorio<\/strong> hacer el m\u00f3dulo de limpieza (aunque es buena pr\u00e1ctica).<\/p>"}, {"id": "cuenta-propia", "group": "sub", "label": "Ruta: tu propia cuenta", "num": null, "mins": null, "kind": null, "title": "\ud83c\udfe0 Configuraci\u00f3n con tu propia cuenta", "html": "<p>Usa esta ruta si haces el taller por tu cuenta o si no tienes c\u00f3digo de evento.<\/p>\n<h2>1. Necesitas una cuenta de AWS<\/h2>\n<p>Si no tienes una, cr\u00e9ala en <strong>https://aws.amazon.com/<\/strong> \u2192 <em>Create an AWS Account<\/em>. Te pedir\u00e1 una tarjeta, pero este taller cuesta <strong>centavos de d\u00f3lar<\/strong> si sigues la limpieza al final.<\/p>\n<h2>2. No uses el usuario ra\u00edz (root)<\/h2>\n<p>AWS no permite crear Knowledge Bases con el usuario ra\u00edz. Entra con un <strong>usuario de IAM<\/strong> o con <strong>IAM Identity Center<\/strong> que tenga permisos de administrador.<\/p>\n<p>\u00bfSolo tienes el usuario ra\u00edz? Crea un usuario administrador as\u00ed:<\/p>\n<ol>\n<li>Ve a <strong>IAM<\/strong> \u2192 <strong>Users<\/strong> \u2192 <strong>Create user<\/strong>.<\/li>\n<li>Nombre: <code>taller-rag<\/code>. Marca <strong>Provide user access to the AWS Management Console<\/strong>.<\/li>\n<li>En permisos, elige <strong>Attach policies directly<\/strong> \u2192 <code>AdministratorAccess<\/code>.<\/li>\n<li>Termina el asistente, guarda la URL de inicio de sesi\u00f3n y entra con ese usuario.<\/li>\n<\/ol>\n<aside class=\"callout warn\">\n<p>\ud83d\udd10 Activa MFA en tu usuario ra\u00edz y en el nuevo usuario. Es la medida de seguridad m\u00e1s importante en AWS.<\/p>\n<\/aside>\n<h2>3. Configura una alerta de presupuesto (recomendado)<\/h2>\n<p>As\u00ed recibes un correo si algo empieza a cobrar m\u00e1s de lo esperado:<\/p>\n<ol>\n<li>Ve a <strong>Billing and Cost Management<\/strong> \u2192 <strong>Budgets<\/strong> \u2192 <strong>Create budget<\/strong>.<\/li>\n<li>Elige la plantilla <strong>Zero spend budget<\/strong> (o <em>Monthly cost budget<\/em> de 5 USD).<\/li>\n<li>Escribe tu correo y crea el presupuesto.<\/li>\n<\/ol>\n<h2>4. \u00bfCu\u00e1nto cuesta este taller?<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Recurso<\/th>\n<th>Costo aproximado<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Embeddings con Titan V2 (\u2248 10,000 tokens)<\/td>\n<td>&lt; 0.01 USD<\/td>\n<\/tr>\n<tr>\n<td>Amazon S3 Vectors (unos cientos de vectores)<\/td>\n<td>&lt; 0.01 USD<\/td>\n<\/tr>\n<tr>\n<td>Respuestas con Nova 2 Lite (\u2248 50 preguntas)<\/td>\n<td>&lt; 0.10 USD<\/td>\n<\/tr>\n<tr>\n<td>Amazon S3 (5 archivos peque\u00f1os)<\/td>\n<td>&lt; 0.01 USD<\/td>\n<\/tr>\n<tr>\n<td><strong>Total estimado<\/strong><\/td>\n<td><strong>&lt; 1 USD<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"callout warn\">\n<p>\u26a0\ufe0f Usamos <strong>S3 Vectors<\/strong> como base de datos vectorial porque se cobra por uso. Si eliges <strong>OpenSearch Serverless<\/strong> en lugar de S3 Vectors, se cobra <strong>por hora<\/strong> aunque no lo uses y puede costar <strong>cientos de d\u00f3lares al mes<\/strong>. Sigue la gu\u00eda tal cual.<\/p>\n<\/aside>\n<p>Los precios cambian. Revisa la <a href=\"https://aws.amazon.com/bedrock/pricing/\" target=\"_blank\" rel=\"noopener\">p\u00e1gina de precios de Amazon Bedrock<\/a> si tienes dudas.<\/p>\n<h2>5. Anthropic (opcional)<\/h2>\n<p>Este taller usa <strong>Amazon Nova<\/strong>, que no requiere ning\u00fan formulario. Si m\u00e1s adelante quieres usar modelos de <strong>Anthropic Claude<\/strong>, la primera vez Bedrock te pedir\u00e1 llenar un breve formulario de caso de uso (<em>First Time Use<\/em>).<\/p>"}, {"id": "conceptos", "group": "Taller", "label": "\u00bfQu\u00e9 es RAG?", "num": "1", "mins": 15, "kind": "Teor\u00eda", "title": "1 \u00b7 Conceptos: \u00bfqu\u00e9 es RAG?", "html": "<h2>El problema<\/h2>\n<p>Los modelos de lenguaje (LLMs) como Amazon Nova, Claude o GPT saben <strong>much\u00edsimo<\/strong>, pero tienen tres limitaciones:<\/p>\n<ol>\n<li><strong>No conocen tus datos.<\/strong> Nunca leyeron el reglamento de tu empresa, tus manuales ni tus contratos.<\/li>\n<li><strong>Tienen fecha de corte.<\/strong> Su conocimiento se congela el d\u00eda que terminaron de entrenarlos.<\/li>\n<li><strong>Pueden inventar.<\/strong> Cuando no saben algo, a veces responden con mucha seguridad algo falso. A esto se le llama <strong>alucinaci\u00f3n<\/strong>.<\/li>\n<\/ol>\n<h2>La soluci\u00f3n: RAG<\/h2>\n<p><strong>RAG<\/strong> significa <em>Retrieval-Augmented Generation<\/em>, o <strong>generaci\u00f3n aumentada con recuperaci\u00f3n<\/strong>. La idea es sencilla:<\/p>\n<aside class=\"callout tip\">\n<p>Antes de que el modelo responda, <strong>busca<\/strong> en tus documentos la informaci\u00f3n relevante y <strong>se la da<\/strong> junto con la pregunta.<\/p>\n<\/aside>\n<p>Es como un examen <strong>a libro abierto<\/strong>: el modelo no tiene que memorizar tu reglamento, solo tiene que saber buscar y leer.<\/p>\n<h2>Las piezas de un sistema RAG<\/h2>\n<h3>1. Documentos fuente<\/h3>\n<p>Tus archivos: PDF, Word, Markdown, HTML, CSV\u2026 En este taller viven en <strong>Amazon S3<\/strong>.<\/p>\n<h3>2. Chunking (fragmentaci\u00f3n)<\/h3>\n<p>Un documento completo es demasiado grande para buscar con precisi\u00f3n. Por eso se divide en <strong>chunks<\/strong> (fragmentos) de unos cientos de palabras.<\/p>\n<aside class=\"callout tip\">\n<p>\ud83d\udca1 Si los chunks son muy chicos, pierden contexto. Si son muy grandes, mezclan temas y la b\u00fasqueda es menos precisa.<\/p>\n<\/aside>\n<h3>3. Embeddings<\/h3>\n<p>Un <strong>embedding<\/strong> es una lista de n\u00fameros (un <strong>vector<\/strong>) que representa el <strong>significado<\/strong> de un texto. Textos con significado parecido tienen vectores cercanos, aunque usen palabras distintas:<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Texto<\/th>\n<th>\u00bfCercano a \"d\u00edas de vacaciones\"?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\"periodo de descanso anual\"<\/td>\n<td>\u2705 Muy cercano<\/td>\n<\/tr>\n<tr>\n<td>\"prima vacacional del 50 %\"<\/td>\n<td>\u2705 Cercano<\/td>\n<\/tr>\n<tr>\n<td>\"reembolso de taxi\"<\/td>\n<td>\u274c Lejano<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>En este taller usamos <strong>Amazon Titan Text Embeddings V2<\/strong>, que entiende espa\u00f1ol.<\/p>\n<h3>4. Base de datos vectorial<\/h3>\n<p>Guarda los vectores y permite buscar los <strong>m\u00e1s parecidos<\/strong> a la pregunta (<strong>b\u00fasqueda sem\u00e1ntica<\/strong>). Usamos <strong>Amazon S3 Vectors<\/strong>.<\/p>\n<h3>5. Modelo generador<\/h3>\n<p>Recibe la pregunta y los chunks encontrados, y redacta una respuesta en lenguaje natural. Usamos <strong>Amazon Nova 2 Lite<\/strong>.<\/p>\n<h2>El flujo completo<\/h2>\n<figure class=\"diagram\"><svg role=\"img\" aria-label=\"Diagrama\" aria-roledescription=\"sequence\" role=\"graphics-document document\" viewBox=\"-50 -10 1050 523\" style=\"max-width: 1050px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"mmd1\"><g><rect class=\"actor actor-bottom\" ry=\"3\" rx=\"3\" name=\"M\" height=\"65\" width=\"150\" stroke=\"var(--muted)\" fill=\"var(--surface-2)\" y=\"437\" x=\"800\"><\/rect><text style=\"text-anchor: middle; font-size: 16px; font-weight: 400;\" class=\"actor actor-box\" alignment-baseline=\"central\" dominant-baseline=\"central\" y=\"469.5\" x=\"875\"><tspan dy=\"0\" x=\"875\">\ud83e\udd16 Nova 2 Lite<\/tspan><\/text><\/g><g><rect class=\"actor actor-bottom\" ry=\"3\" rx=\"3\" name=\"V\" height=\"65\" width=\"150\" stroke=\"var(--muted)\" fill=\"var(--surface-2)\" y=\"437\" x=\"600\"><\/rect><text style=\"text-anchor: middle; font-size: 16px; font-weight: 400;\" class=\"actor actor-box\" alignment-baseline=\"central\" dominant-baseline=\"central\" y=\"469.5\" x=\"675\"><tspan dy=\"0\" x=\"675\">\ud83e\udded S3 Vectors<\/tspan><\/text><\/g><g><rect class=\"actor actor-bottom\" ry=\"3\" rx=\"3\" name=\"KB\" height=\"65\" width=\"153\" stroke=\"var(--muted)\" fill=\"var(--surface-2)\" y=\"437\" x=\"310.5\"><\/rect><text style=\"text-anchor: middle; font-size: 16px; font-weight: 400;\" class=\"actor actor-box\" alignment-baseline=\"central\" dominant-baseline=\"central\" y=\"469.5\" x=\"387\"><tspan dy=\"0\" x=\"387\">\ud83d\udcda Knowledge Base<\/tspan>
