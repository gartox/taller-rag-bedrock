uot;<\/span><span class=\"p\">,<\/span> <span class=\"s2\">&quot;apac.&quot;<\/span><span class=\"p\">,<\/span> <span class=\"s2\">&quot;jp.&quot;<\/span><span class=\"p\">,<\/span> <span class=\"s2\">&quot;global.&quot;<\/span><span class=\"p\">)<\/span>\n    <span class=\"k\">if<\/span> <span class=\"n\">model_id<\/span><span class=\"o\">.<\/span><span class=\"n\">startswith<\/span><span class=\"p\">(<\/span><span class=\"n\">prefixes<\/span><span class=\"p\">):<\/span>\n        <span class=\"n\">account<\/span> <span class=\"o\">=<\/span> <span class=\"n\">boto3<\/span><span class=\"o\">.<\/span><span class=\"n\">client<\/span><span class=\"p\">(<\/span><span class=\"s2\">&quot;sts&quot;<\/span><span class=\"p\">,<\/span> <span class=\"n\">region_name<\/span><span class=\"o\">=<\/span><span class=\"n\">REGION<\/span><span class=\"p\">)<\/span><span class=\"o\">.<\/span><span class=\"n\">get_caller_identity<\/span><span class=\"p\">()[<\/span><span class=\"s2\">&quot;Account&quot;<\/span><span class=\"p\">]<\/span>\n        <span class=\"k\">return<\/span> <span class=\"sa\">f<\/span><span class=\"s2\">&quot;arn:aws:bedrock:<\/span><span class=\"si\">{<\/span><span class=\"n\">REGION<\/span><span class=\"si\">}<\/span><span class=\"s2\">:<\/span><span class=\"si\">{<\/span><span class=\"n\">account<\/span><span class=\"si\">}<\/span><span class=\"s2\">:inference-profile/<\/span><span class=\"si\">{<\/span><span class=\"n\">model_id<\/span><span class=\"si\">}<\/span><span class=\"s2\">&quot;<\/span>\n\n    <span class=\"k\">return<\/span> <span class=\"sa\">f<\/span><span class=\"s2\">&quot;arn:aws:bedrock:<\/span><span class=\"si\">{<\/span><span class=\"n\">REGION<\/span><span class=\"si\">}<\/span><span class=\"s2\">::foundation-model/<\/span><span class=\"si\">{<\/span><span class=\"n\">model_id<\/span><span class=\"si\">}<\/span><span class=\"s2\">&quot;<\/span>\n\n\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">kb_runtime<\/span><span class=\"p\">():<\/span>\n<span class=\"w\">    <\/span><span class=\"sd\">&quot;&quot;&quot;Cliente de &#39;bedrock-agent-runtime&#39;: el que expone Retrieve y RetrieveAndGenerate.&quot;&quot;&quot;<\/span>\n    <span class=\"k\">return<\/span> <span class=\"n\">boto3<\/span><span class=\"o\">.<\/span><span class=\"n\">client<\/span><span class=\"p\">(<\/span><span class=\"s2\">&quot;bedrock-agent-runtime&quot;<\/span><span class=\"p\">,<\/span> <span class=\"n\">region_name<\/span><span class=\"o\">=<\/span><span class=\"n\">REGION<\/span><span class=\"p\">)<\/span>\n\n\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">source_name<\/span><span class=\"p\">(<\/span><span class=\"n\">reference<\/span><span class=\"p\">:<\/span> <span class=\"nb\">dict<\/span><span class=\"p\">)<\/span> <span class=\"o\">-&gt;<\/span> <span class=\"nb\">str<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"sd\">&quot;&quot;&quot;Saca un nombre corto y legible del documento fuente de una referencia.&quot;&quot;&quot;<\/span>\n    <span class=\"n\">uri<\/span> <span class=\"o\">=<\/span> <span class=\"n\">reference<\/span><span class=\"o\">.<\/span><span class=\"n\">get<\/span><span class=\"p\">(<\/span><span class=\"s2\">&quot;location&quot;<\/span><span class=\"p\">,<\/span> <span class=\"p\">{})<\/span><span class=\"o\">.<\/span><span class=\"n\">get<\/span><span class=\"p\">(<\/span><span class=\"s2\">&quot;s3Location&quot;<\/span><span class=\"p\">,<\/span> <span class=\"p\">{})<\/span><span class=\"o\">.<\/span><span class=\"n\">get<\/span><span class=\"p\">(<\/span><span class=\"s2\">&quot;uri&quot;<\/span><span class=\"p\">,<\/span> <span class=\"s2\">&quot;&quot;<\/span><span class=\"p\">)<\/span>\n    <span class=\"k\">return<\/span> <span class=\"n\">uri<\/span><span class=\"o\">.<\/span><span class=\"n\">rsplit<\/span><span class=\"p\">(<\/span><span class=\"s2\">&quot;/&quot;<\/span><span class=\"p\">,<\/span> <span class=\"mi\">1<\/span><span class=\"p\">)[<\/span><span class=\"o\">-<\/span><span class=\"mi\">1<\/span><span class=\"p\">]<\/span> <span class=\"k\">if<\/span> <span class=\"n\">uri<\/span> <span class=\"k\">else<\/span> <span class=\"s2\">&quot;(fuente desconocida)&quot;<\/span>\n<\/pre><\/div>\n<\/div><\/details>\n<h2>Documentos de Cacao Labs<\/h2><p>Los documentos ficticios que subes a S3 en el m\u00f3dulo 2. As\u00ed los \"ve\" tu Knowledge Base.<\/p>\n<details class=\"file\"><summary><code>data/extra/politica-mascotas.md<\/code><\/summary><div class=\"docprev\"><h1>Pol\u00edtica de Mascotas en la Oficina \u2014 Cacao Labs<\/h1>\n<p><em>Versi\u00f3n 1.0 \u2014 Vigente desde octubre de 2026. Documento ficticio para fines educativos.<\/em><\/p>\n<h2>1. \u00bfPuedo llevar a mi mascota a la oficina?<\/h2>\n<p>S\u00ed. Cacao Labs es una oficina <strong>pet-friendly<\/strong> los <strong>jueves<\/strong>, con estas reglas:<\/p>\n<ul>\n<li>Solo se permiten <strong>perros y gatos<\/strong> con vacunas al d\u00eda. Hay que registrar el carnet de vacunaci\u00f3n en \"J\u00edcara\" antes de la primera visita.<\/li>\n<li>M\u00e1ximo <strong>4 mascotas<\/strong> por d\u00eda en la oficina. El lugar se reserva en \"J\u00edcara\" en la secci\u00f3n <em>Espacios<\/em>.<\/li>\n<li>Las mascotas deben quedarse en el \u00e1rea de colaboraci\u00f3n del segundo piso. No pueden entrar a las salas de juntas ni a la cocina.<\/li>\n<li>La persona due\u00f1a es responsable de la limpieza y de cualquier da\u00f1o.<\/li>\n<\/ul>\n<h2>2. Apoyo para mascotas<\/h2>\n<p>La empresa entrega un apoyo anual de <strong>$1,500 MXN<\/strong> por colaborador para gastos veterinarios, que se solicita igual que un reembolso de gastos.<\/p>\n<h2>3. D\u00eda libre por adopci\u00f3n<\/h2>\n<p>Si adoptas una mascota de un refugio, tienes <strong>1 d\u00eda libre con goce de sueldo<\/strong> para ayudarle a adaptarse a su nuevo hogar.<\/p><\/div><p class=\"metalabel\">Metadatos: <code>politica-mascotas.md.metadata.json<\/code><\/p><div class=\"code\" data-lang=\"JSON\"><div class=\"hl\"><pre><span><\/span><span class=\"p\">{<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">&quot;metadataAttributes&quot;<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">&quot;area&quot;<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"s2\">&quot;personas&quot;<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">&quot;anio&quot;<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"mi\">2026<\/span>\n<span class=\"w\">  <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n<\/pre><\/div>\n<\/div><\/details>\n<details class=\"file\"><summary><code>data/faq-onboarding.md<\/code><\/summary><div class=\"docprev\"><h1>Preguntas frecuentes de nuevo ingreso \u2014 Cacao Labs<\/h1>\n<p><em>Documento ficticio para fines educativos.<\/em><\/p>\n<h3>\u00bfQu\u00e9 es Cacao Labs?<\/h3>\n<p>Cacao Labs es una startup de tecnolog\u00eda con sede en C\u00e1rdenas, Tabasco. Desarrollamos software para la trazabilidad del cacao, desde la hacienda hasta la chocolater\u00eda, usando sensores IoT y servicios en la nube de AWS. Fue fundada en 2020 y hoy tiene 42 colaboradores.<\/p>\n<h3>\u00bfQu\u00e9 hago en mi primer d\u00eda?<\/h3>\n<ol>\n<li>Llega a la oficina a las 9:30. Te recibe tu <em>buddy<\/em> (compa\u00f1ero de acompa\u00f1amiento).<\/li>\n<li>Recoge tu laptop y tu gafete con el equipo de TI.<\/li>\n<li>Configura tu MFA y el gestor de contrase\u00f1as.<\/li>\n<li>A las 12:00 tienes la pl\u00e1tica de bienvenida con la direcci\u00f3n.<\/li>\n<li>Comida de bienvenida con tu equipo (la paga la empresa).<\/li>\n<\/ol>\n<h3>\u00bfQui\u00e9n es mi buddy?<\/h3>\n<p>Es una persona de otra \u00e1rea que te acompa\u00f1a durante tus primeros <strong>90 d\u00edas<\/strong>. Puedes preguntarle cualquier cosa, sobre todo lo que te d\u00e9 pena preguntarle a tu l\u00edder.<\/p>\n<h3>\u00bfCu\u00e1ndo me pagan?<\/h3>\n<p>La n\u00f3mina se paga <strong>quincenalmente<\/strong>, los d\u00edas 15 y \u00faltimo de cada mes. Si el d\u00eda de pago cae en fin de semana o d\u00eda festivo, se paga el d\u00eda h\u00e1bil anterior.<\/p>\n<h3>\u00bfQu\u00e9 prestaciones tengo?<\/h3>\n<ul>\n<li>Prestaciones de ley.<\/li>\n<li>Seguro de gastos m\u00e9dicos mayores para ti, tu pareja y tus hijos.<\/li>\n<li>Vales de despensa por el 10 % del salario mensual.<\/li>\n<li>Fondo de ahorro del 13 % (la empresa aporta lo mismo que t\u00fa).<\/li>\n<li>Apoyo de $800 MXN mensuales para internet y electricidad.<\/li>\n<li>$12,000 MXN anuales para capacitaci\u00f3n.<\/li>\n<\/ul>\n<h3>\u00bfCu\u00e1nto dura el periodo de prueba?<\/h3>\n<p>El periodo de prueba es de <strong>90 d\u00edas<\/strong>. Al final tendr\u00e1s una reuni\u00f3n de retroalimentaci\u00f3n con tu l\u00edder y tu buddy.<\/p>\n<h3>\u00bfD\u00f3nde est\u00e1 la oficina?<\/h3>\n<p>La oficina est\u00e1 en el centro de C\u00e1rdenas, Tabasco, a dos cuadras del parque principal. Hay estacionamiento para bicicletas y 8 cajones para autos, que se asignan por orden de llegada.<\/p>\n<h3>\u00bfA qui\u00e9n le pregunto si tengo dudas sobre mi n\u00f3mina?<\/h3>\n<p>Escribe a nomina@cacaolabs.example o abre un ticket en \"J\u00edcara\" en la secci\u00f3n <em>Personas<\/em>.<\/p><\/div><p class=\"metalabel\">Metadatos: <code>faq-onboarding.md.metadata.json<\/code><\/p><div class=\"code\" data-lang=\"JSON\"><div class=\"hl\"><pre><span><\/span><span class=\"p\">{<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">&quot;metadataAttributes&quot;<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">&quot;area&quot;<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"s2\">&quot;personas&quot;<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">&quot;anio&quot;<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"mi\">2026<\/span>\n<span class=\"w\">  <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n<\/pre><\/div>\n<\/div><\/details>\n<details class=\"file\"><summary><code>data/guia-seguridad-ti.md<\/code><\/summary><div class=\"docprev\"><h1>Gu\u00eda de Seguridad de TI \u2014 Cacao Labs<\/h1>\n<p><em>Versi\u00f3n 1.4 \u2014 Documento ficticio para fines educativos.<\/em><\/p>\n<h2>1. Equipo de c\u00f3mputo<\/h2>\n<p>Cada colaborador recibe una laptop de la empresa. Es responsabilidad de cada persona:<\/p>\n<ul>\n<li>Mantener el sistema operativo actualizado (las actualizaciones se aplican autom\u00e1ticamente los mi\u00e9rcoles a las 13:00).<\/li>\n<li>No instalar software sin licencia.<\/li>\n<li>Usar el disco cifrado que viene configurado de f\u00e1brica. <strong>No se debe desactivar el cifrado<\/strong>.<\/li>\n<\/ul>\n<h2>2. Si pierdes tu laptop o te la roban<\/h2>\n<p>Act\u00faa r\u00e1pido. Sigue estos pasos <strong>en la primera hora<\/strong>:<\/p>\n<ol>\n<li>Rep\u00f3rtalo al canal <strong>#seguridad<\/strong> en el chat interno o al correo seguridad@cacaolabs.example.<\/li>\n<li>Llama a la l\u00ednea de guardia de TI: <strong>993 000 0000<\/strong> (n\u00famero ficticio), disponible 24/7.<\/li>\n<li>TI bloquear\u00e1 el equipo de forma remota y cerrar\u00e1 todas tus sesiones activas.<\/li>\n<li>Si fue un robo, levanta una denuncia ante el Ministerio P\u00fablico y env\u00eda una copia a TI en un plazo de 72 horas.<\/li>\n<\/ol>\n<p>La primera p\u00e9rdida no tiene costo para el colaborador. A partir de la segunda p\u00e9rdida en un periodo de 24 meses, se descuenta el 30 % del valor del equipo.<\/p>\n<h2>3. Contrase\u00f1as y accesos<\/h2>\n<ul>\n<li>Todas las cuentas usan inicio de sesi\u00f3n \u00fanico (SSO) y <strong>autenticaci\u00f3n multifactor (MFA)<\/strong> obligatoria.<\/li>\n<li>Usa el gestor de contrase\u00f1as que proporciona la empresa. Est\u00e1 prohibido guardar contrase\u00f1as en archivos de texto u hojas de c\u00e1lculo.<\/li>\n<li><strong>Nunca<\/strong> compartas llaves de acceso de AWS en el chat, el correo ni en repositorios de c\u00f3digo. Si una llave se filtra, avisa de inmediato a #seguridad para rotarla.<\/li>\n<\/ul>\n<h2>4. Uso de IA generativa<\/h2>\n<p>Se permite usar asistentes de IA para el trabajo diario con estas reglas:<\/p>\n<ul>\n<li>Solo se pueden usar las herramientas aprobadas en el cat\u00e1logo interno de TI.<\/li>\n<li>No se deben pegar datos personales de clientes ni c\u00f3digo propiedad de clientes en herramientas de IA p\u00fablicas.<\/li>\n<li>Los modelos que se usan con datos de clientes deben ejecutarse dentro de la cuenta de AWS del proyecto (por ejemplo, con Amazon Bedrock).<\/li>\n<\/ul>\n<h2>5. Wi-Fi y redes<\/h2>\n<ul>\n<li>En la oficina usa la red <strong>CacaoLabs-Staff<\/strong>. La red <strong>CacaoLabs-Visitas<\/strong> es solo para invitados.<\/li>\n<li>En redes p\u00fablicas (cafeter\u00edas, aeropuertos) se debe activar la VPN de la empresa antes de abrir cualquier sistema interno.<\/li>\n<\/ul><\/div><p class=\"metalabel\">Metadatos: <code>guia-seguridad-ti.md.metadata.json<\/code><\/p><div class=\"code\" data-lang=\"JSON\"><div class=\"hl\"><pre><span><\/span><span class=\"p\">{<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">&quot;metadataAttributes&quot;<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">&quot;area&quot;<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"s2\">&quot;ti&quot;<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">&quot;anio&quot;<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"mi\">2025<\/span>\n<span class=\"w\">  <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n<\/pre><\/div>\n<\/div><\/details>\n<details class=\"file\"><summary><code>data/politica-gastos-y-viajes.md<\/code><\/summary><div class=\"docprev\"><h1>Pol\u00edtica de Gastos y Viajes \u2014 Cacao Labs<\/h1>\n<p><em>Versi\u00f3n 2.0 \u2014 Vigente desde marzo de 2026. Documento ficticio para fines educativos.<\/em><\/p>\n<h2>1. Objetivo<\/h2>\n<p>Esta pol\u00edtica define qu\u00e9 gastos de trabajo cubre Cacao Labs y c\u00f3mo solicitar su reembolso.<\/p>\n<h2>2. Vi\u00e1ticos por d\u00eda<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Destino<\/th>\n<th>Hospedaje m\u00e1ximo por noche<\/th>\n<th>Alimentos por d\u00eda<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Tabasco<\/td>\n<td>$1,200 MXN<\/td>\n<td>$450 MXN<\/td>\n<\/tr>\n<tr>\n<td>Resto de M\u00e9xico<\/td>\n<td>$1,800 MXN<\/td>\n<td>$600 MXN<\/td>\n<\/tr>\n<tr>\n<td>CDMX, Monterrey, Guadalajara<\/td>\n<td>$2,300 MXN<\/td>\n<td>$750 MXN<\/td>\n<\/tr>\n<tr>\n<td>Extranjero<\/td>\n<td>$160 USD<\/td>\n<td>$70 USD<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Las bebidas alcoh\u00f3licas <strong>no son reembolsables<\/strong> en ning\u00fan caso.<\/p>\n<h2>3. Transporte<\/h2>\n<ul>\n<li><strong>Avi\u00f3n<\/strong>: siempre en clase turista, comprado con al menos 14 d\u00edas de anticipaci\u00f3n cuando sea posible.<\/li>\n<li><strong>Autob\u00fas<\/strong>: se recomienda para viajes entre C\u00e1rdenas y Villahermosa o dentro del sureste.<\/li>\n<li><strong>Auto propio<\/strong>: se reembolsan <strong>$5.50 MXN por kil\u00f3metro<\/strong> m\u00e1s casetas. Hay que registrar el kilometraje inicial y final con foto del tablero.<\/li>\n<li><strong>Taxi o app de transporte<\/strong>: se reembolsa solo si no hay alternativa de transporte p\u00fablico razonable o si es despu\u00e9s de las 22:00 horas.<\/li>\n<\/ul>\n<h2>4. C\u00f3mo pedir un reembolso<\/h2>\n<ol>\n<li>Entra a la plataforma <strong>\"J\u00edcara\"<\/strong> y abre la secci\u00f3n <em>Gastos<\/em>.<\/li>\n<li>Crea un reporte de gastos por viaje o por mes.<\/li>\n<li>Adjunta la <strong>factura electr\u00f3nica (CFDI)<\/strong> a nombre de Cacao Labs S.A. de C.V. con RFC CLA200115XX0 (ficticio). Sin CFDI no hay reembolso, salvo propinas y transporte p\u00fablico.<\/li>\n<li>Env\u00eda el reporte a tu l\u00edder de \u00e1rea para que lo apruebe.<\/li>\n<li>Finanzas paga los reembolsos aprobados <strong>los d\u00edas 10 y 25 de cada mes<\/strong> por transferencia.<\/li>\n<\/ol>\n<p>El plazo m\u00e1ximo para enviar un reporte es de <strong>30 d\u00edas naturales<\/strong> despu\u00e9s del gasto. Los reportes que lleguen tarde se rechazan autom\u00e1ticamente.<\/p>\n<h2>5. Tarjeta corporativa<\/h2>\n<p>Las personas con viajes frecuentes (m\u00e1s de 4 viajes por trimestre) pueden solicitar una tarjeta corporativa con un l\u00edmite de $40,000 MXN mensuales. Se solicita a finanzas@cacaolabs.example.<\/p>\n<h2>6. Gastos que no se reembolsan<\/h2>\n<ul>\n<li>Multas de tr\u00e1nsito o de estacionamiento.<\/li>\n<li>Mejoras de categor\u00eda en vuelos u hoteles.<\/li>\n<li>Gastos de acompa\u00f1antes.<\/li>\n<li>Minibar, lavander\u00eda en estancias menores a 5 d\u00edas y entretenimiento personal.<\/li>\n<\/ul><\/div><p class=\"metalabel\">Metadatos: <code>politica-gastos-y-viajes.md.metadata.json<\/code><\/p><div class=\"code\" data-lang=\"JSON\"><div class=\"hl\"><pre><span><\/span><span class=\"p\">{<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">&quot;metadataAttributes&quot;<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">&quot;area&quot;<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"s2\">&quot;finanzas&quot;<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">&quot;anio&quot;<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"mi\">2026<\/span>\n<span class=\"w\">  <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n<\/pre><\/div>\n<\/div><\/details>\n<details class=\"file\"><summary><code>data/reglamento-interno.md<\/code><\/summary><div class=\"docprev\"><h1>Reglamento Interno de Trabajo \u2014 Cacao Labs S.A. de C.V.<\/h1>\n<p><em>Versi\u00f3n 3.2 \u2014 Vigente desde el 1 de enero de 2026. Documento ficticio para fines educativos.<\/em><\/p>\n<h2>1. Horario de trabajo<\/h2>\n<p>La jornada laboral en Cacao Labs es de lunes a viernes, de 9:00 a 18:00 horas, con una hora para comer entre las 14:00 y las 15:00. El equipo puede elegir un <strong>horario flexible<\/strong>: entrar entre las 8:00 y las 10:00 y salir nueve horas despu\u00e9s.<\/p>\n<p>Los viernes la jornada termina a las 15:00 horas (\"viernes cortos\"), siempre que la persona no tenga entregables pendientes con clientes.<\/p>\n<h2>2. Trabajo remoto<\/h2>\n<p>Cacao Labs opera con un modelo <strong>h\u00edbrido<\/strong>:<\/p>\n<ul>\n<li>Se trabaja en la oficina de C\u00e1rdenas, Tabasco, <strong>martes y jueves<\/strong>.<\/li>\n<li>Lunes, mi\u00e9rcoles y viernes se puede trabajar de forma remota desde cualquier lugar de M\u00e9xico.<\/li>\n<li>Para trabajar desde fuera de M\u00e9xico se necesita autorizaci\u00f3n por escrito del l\u00edder de \u00e1rea, con al menos <strong>15 d\u00edas naturales<\/strong> de anticipaci\u00f3n. El m\u00e1ximo es de 30 d\u00edas por a\u00f1o calendario.<\/li>\n<\/ul>\n<p>La empresa entrega un apoyo mensual de <strong>$800 MXN<\/strong> para internet y electricidad, que se paga junto con la n\u00f3mina de la segunda quincena de cada mes.<\/p>\n<h2>3. Vacaciones<\/h2>\n<p>Cacao Labs otorga m\u00e1s d\u00edas de vacaciones que el m\u00ednimo que marca la Ley Federal del Trabajo:<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Antig\u00fcedad<\/th>\n<th>D\u00edas de vacaciones<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Primer a\u00f1o<\/td>\n<td>15 d\u00edas h\u00e1biles<\/td>\n<\/tr>\n<tr>\n<td>Segundo a\u00f1o<\/td>\n<td>17 d\u00edas h\u00e1biles<\/td>\n<\/tr>\n<tr>\n<td>Tercer a\u00f1o<\/td>\n<td>19 d\u00edas h\u00e1biles<\/td>\n<\/tr>\n<tr>\n<td>Cuarto a\u00f1o<\/td>\n<td>21 d\u00edas h\u00e1biles<\/td>\n<\/tr>\n<tr>\n<td>Quinto a\u00f1o en adelante<\/td>\n<td>22 d\u00edas h\u00e1biles + 2 d\u00edas por cada 5 a\u00f1os adicionales<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Reglas para solicitar vacaciones:<\/p>\n<ol>\n<li>Se solicitan en la plataforma interna <strong>\"J\u00edcara\"<\/strong> con al menos <strong>10 d\u00edas h\u00e1biles<\/strong> de anticipaci\u00f3n.<\/li>\n<li>Se pueden tomar desde el <strong>primer mes<\/strong> de trabajo de forma proporcional.<\/li>\n<li>Los d\u00edas no utilizados se pueden acumular <strong>hasta por 12 meses<\/strong>. Despu\u00e9s de ese plazo se pierden.<\/li>\n<li>La prima vacacional es del <strong>50 %<\/strong> del salario correspondiente a los d\u00edas de vacaciones.<\/li>\n<\/ol>\n<h2>4. D\u00edas de descanso adicionales<\/h2>\n<p>Adem\u00e1s de los d\u00edas de descanso obligatorio por ley, Cacao Labs otorga:<\/p>\n<ul>\n<li>El d\u00eda de tu cumplea\u00f1os.<\/li>\n<li>El 2 de noviembre (D\u00eda de Muertos).<\/li>\n<li>El 24 y 31 de diciembre.<\/li>\n<li><strong>D\u00eda de la Cosecha<\/strong>: un viernes de octubre que se anuncia cada a\u00f1o, en el que todo el equipo visita una hacienda cacaotera de la regi\u00f3n.<\/li>\n<\/ul>\n<h2>5. C\u00f3digo de vestimenta<\/h2>\n<p>No hay un c\u00f3digo de vestimenta formal. Para reuniones presenciales con clientes se recomienda vestimenta casual de negocios. La empresa entrega dos camisas con el logo de Cacao Labs al ingresar y una m\u00e1s cada a\u00f1o.<\/p>\n<h2>6. Capacitaci\u00f3n<\/h2>\n<p>Cada colaborador tiene un presupuesto anual de <strong>$12,000 MXN<\/strong> para cursos, libros o certificaciones. Las certificaciones de AWS se reembolsan al <strong>100 %<\/strong> si se aprueban en el primer intento y al <strong>50 %<\/strong> si se aprueban en el segundo intento.<\/p>\n<p>Las solicitudes se env\u00edan por correo a capacitacion@cacaolabs.example con el enlace del curso y su costo.<\/p><\/div><p class=\"metalabel\">Metadatos: <code>reglamento-interno.md.metadata.json<\/code><\/p><div class=\"code\" data-lang=\"JSON\"><div class=\"hl\"><pre><span><\/span><span class=\"p\">{<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">&quot;metadataAttributes&quot;<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">&quot;area&quot;<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"s2\">&quot;personas&quot;<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">&quot;anio&quot;<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"mi\">2026<\/span>\n<span class=\"w\">  <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n<\/pre><\/div>\n<\/div><\/details>"}, {"id": "troubleshooting", "group": "Recursos", "label": "Soluci\u00f3n de problemas", "num": null, "mins": null, "kind": null, "title": "\ud83d\udedf Soluci\u00f3n de problemas", "html": "<h2>\"Falta la variable KB_ID\"<\/h2>\n<p>CloudShell perdi\u00f3 tus variables (pasa si estuvo inactivo o se reinici\u00f3). Vuelve a ejecutar:<\/p>\n<div class=\"code\" data-lang=\"Terminal\"><div class=\"hl\"><pre><span><\/span><span class=\"nb\">export<\/span><span class=\"w\"> <\/span><span class=\"nv\">KB_ID<\/span><span class=\"o\">=<\/span><span class=\"s2\">&quot;TU_ID&quot;<\/span>\n<span class=\"nb\">cd<\/span><span class=\"w\"> <\/span>~/taller-rag-bedrock/scripts\n<\/pre><\/div>\n<\/div>\n<h2><code>AccessDeniedException<\/code> al usar un modelo<\/h2>\n<ul>\n<li><strong>Espera 2 minutos y reintenta.<\/strong> La primera vez que usas un modelo, Bedrock activa la suscripci\u00f3n en segundo plano.<\/li>\n<li>Si usas <strong>tu propia cuenta<\/strong>, verifica que tenga un <strong>m\u00e9todo de pago v\u00e1lido<\/strong>. AWS Marketplace lo requiere para activar algunos modelos.<\/li>\n<li>Si usas <strong>Anthropic Claude<\/strong>, primero llena el formulario de caso de uso (<em>First Time Use<\/em>) en la consola de Bedrock.<\/li>\n<li>Si sigue fallando, cambia el modelo:<\/li>\n<\/ul>\n<div class=\"code\" data-lang=\"Terminal\"><div class=\"hl\"><pre><span><\/span><span class=\"nb\">export<\/span><span class=\"w\"> <\/span><span class=\"nv\">MODEL_ID<\/span><span class=\"o\">=<\/span><span class=\"s2\">&quot;us.amazon.nova-lite-v1:0&quot;<\/span>\n<\/pre><\/div>\n<\/div>\n<h2><code>ValidationException: ... model identifier is invalid<\/code> o <code>on-demand throughput isn't supported<\/code><\/h2>\n<p>Est\u00e1s usando el ID del modelo base en lugar del <strong>perfil de inferencia<\/strong>. Usa el prefijo <code>us.<\/code>:<\/p>\n<div class=\"code\" data-lang=\"Terminal\"><div class=\"hl\"><pre><span><\/span><span class=\"nb\">export<\/span><span class=\"w\"> <\/span><span class=\"nv\">MODEL_ID<\/span><span class=\"o\">=<\/span><span class=\"s2\">&quot;us.amazon.nova-2-lite-v1:0&quot;<\/span><span class=\"w\">   <\/span><span class=\"c1\"># \u2705<\/span>\n<span class=\"c1\"># no: amazon.nova-2-lite-v1:0                   # \u274c en us-east-1<\/span>\n<\/pre><\/div>\n<\/div>\n<h2><code>ResourceNotFoundException<\/code> con la Knowledge Base<\/h2>\n<ul>\n<li>Revisa que el <code>KB_ID<\/code> sea correcto (10 caracteres, sin espacios).<\/li>\n<li>Revisa que CloudShell y la consola est\u00e9n en la <strong>misma regi\u00f3n<\/strong> (<code>us-east-1<\/code>).<\/li>\n<\/ul>\n<h2>El Sync dice \"Completed\" pero 0 documentos indexados<\/h2>\n<ul>\n<li>Revisa que el <strong>S3 URI<\/strong> de la fuente de datos apunte a la carpeta <code>docs/<\/code> correcta.<\/li>\n<li>Revisa que los archivos est\u00e9n en el bucket: <code>aws s3 ls s3://taller-rag-&lt;cuenta&gt;/docs/<\/code>.<\/li>\n<\/ul>\n<h2>El Sync marca documentos con error de metadatos<\/h2>\n<p>El archivo <code>.metadata.json<\/code> debe llamarse <strong>exactamente<\/strong> como el documento m\u00e1s <code>.metadata.json<\/code> (por ejemplo, <code>faq-onboarding.md.metadata.json<\/code>) y tener JSON v\u00e1lido.<\/p>\n<h2>No puedo crear la Knowledge Base: \"root user\"<\/h2>\n<p>Bedrock no permite crear Knowledge Bases con el usuario ra\u00edz. Crea un usuario de IAM (ver <a href=\"#cuenta-propia\" data-nav>Configuraci\u00f3n con tu cuenta<\/a>).<\/p>\n<h2>No aparece la opci\u00f3n \"Amazon S3 Vectors\"<\/h2>\n<ul>\n<li>Confirma que est\u00e1s en <code>us-east-1<\/code>.<\/li>\n<li>Busca la opci\u00f3n dentro de <strong>Quick create a new vector store<\/strong>, en el selector del tipo de base de datos.<\/li>\n<\/ul>\n<h2>La respuesta no tiene citas<\/h2>\n<ul>\n<li>Si usas un prompt personalizado, aseg\u00farate de incluir <code>$output_format_instructions$<\/code>.<\/li>\n<li>Si la pregunta no tiene relaci\u00f3n con los documentos, es normal que no haya citas.<\/li>\n<\/ul>\n<h2>La respuesta sale en ingl\u00e9s<\/h2>\n<p>Agrega al prompt: <code>Responde SIEMPRE en espa\u00f1ol.<\/code> (ver <code>03_chat.py<\/code>).<\/p>"}, {"id": "instructor", "group": "Recursos", "label": "Gu\u00eda del instructor", "num": null, "mins": null, "kind": null, "title": "\ud83d\udc69\u200d\ud83c\udfeb Gu\u00eda del instructor", "html": "<p>Notas para quien imparte el taller <strong>\"Habla con tus documentos\"<\/strong> (2 horas, hands-on).<\/p>\n<h2>Filosof\u00eda<\/h2>\n<p><strong>Haz m\u00e1s que hablar.<\/strong> M\u00e1ximo 25 minutos de teor\u00eda en total. El resto es manos en el teclado. Las slides solo acompa\u00f1an; el material vive en este repositorio.<\/p>\n<h2>Agenda sugerida (120 min)<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Hora<\/th>\n<th>Bloque<\/th>\n<th>Material<\/th>\n<th>Notas<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0:00<\/td>\n<td>Bienvenida + setup<\/td>\n<td>Slides 1-4 \u00b7 M\u00f3dulo 0<\/td>\n<td>Proyecta el c\u00f3digo del evento desde el minuto 0.<\/td>\n<\/tr>\n<tr>\n<td>0:10<\/td>\n<td>\u00bfQu\u00e9 es RAG?<\/td>\n<td>Slides 5-12 \u00b7 M\u00f3dulo 1<\/td>\n<td>Haz la demo \"sin RAG\" en vivo antes de explicar.<\/td>\n<\/tr>\n<tr>\n<td>0:25<\/td>\n<td>Datos en S3<\/td>\n<td>M\u00f3dulo 2<\/td>\n<td>Copiar y pegar.<\/td>\n<\/tr>\n<tr>\n<td>0:35<\/td>\n<td>Crear Knowledge Base<\/td>\n<td>Slides 13-14 \u00b7 M\u00f3dulo 3<\/td>\n<td>El paso con m\u00e1s dudas: ve t\u00fa adelante en pantalla.<\/td>\n<\/tr>\n<tr>\n<td>0:55<\/td>\n<td>Probar en consola<\/td>\n<td>M\u00f3dulo 4<\/td>\n<td>Pide que compartan la pregunta trampa m\u00e1s divertida.<\/td>\n<\/tr>\n<tr>\n<td>1:10<\/td>\n<td>Python<\/td>\n<td>Slides 15-16 \u00b7 M\u00f3dulo 5<\/td>\n<td>Lee el c\u00f3digo en voz alta, l\u00ednea por l\u00ednea.<\/td>\n<\/tr>\n<tr>\n<td>1:35<\/td>\n<td>Retos<\/td>\n<td>Slide 17 \u00b7 M\u00f3dulo 6<\/td>\n<td>Reto 1 para todos; el resto, libre.<\/td>\n<\/tr>\n<tr>\n<td>1:50<\/td>\n<td>Limpieza + cierre<\/td>\n<td>Slides 18-20 \u00b7 M\u00f3dulos 7-8<\/td>\n<td>Encuesta, foto grupal y anuncio del siguiente evento.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Antes del evento<\/h2>\n<h3>Una semana antes<\/h3>\n<ul class=\"tasks\">\n<li class=\"task\"><label><input type=\"checkbox\" data-k=\"instructor:1\"><span>Haz el taller completo en una cuenta limpia. La consola de AWS cambia seguido; actualiza capturas y nombres de botones.<\/span><\/label><\/li>\n<li class=\"task\"><label><input type=\"checkbox\" data-k=\"instructor:2\"><span>Confirma que <code>us.amazon.nova-2-lite-v1:0<\/code> funciona en Knowledge Bases. Si no, cambia el valor por defecto en <code>scripts/config.py<\/code>.<\/span><\/label><\/li>\n<li class=\"task\"><label><input type=\"checkbox\" data-k=\"instructor:3\"><span><strong>Ruta evento:<\/strong> pide a tu community manager regional un evento de Workshop Studio con cuentas temporales. Pide permisos para Bedrock, Bedrock Knowledge Bases, S3, S3 Vectors, IAM (crear el service role) y CloudShell en <code>us-east-1<\/code>.<\/span><\/label><\/li>\n<li class=\"task\"><label><input type=\"checkbox\" data-k=\"instructor:4\"><span>Publica el repositorio en GitHub y reemplaza <code>&lt;ORG&gt;<\/code> en <code>docs/00-prerrequisitos/README.md<\/code>.<\/span><\/label><\/li>\n<\/ul>\n<h3>El d\u00eda del evento<\/h3>\n<ul class=\"tasks\">\n<li class=\"task\"><label><input type=\"checkbox\" data-k=\"instructor:5\"><span>Wi-Fi probado con al menos 30 dispositivos.<\/span><\/label><\/li>\n<li class=\"task\"><label><input type=\"checkbox\" data-k=\"instructor:6\"><span>C\u00f3digo de acceso del evento visible en una slide.<\/span><\/label><\/li>\n<li class=\"task\"><label><input type=\"checkbox\" data-k=\"instructor:7\"><span>Una cuenta de respaldo con la Knowledge Base <strong>ya creada<\/strong>, por si alguien se atora en el m\u00f3dulo 3. Comparte el <code>KB_ID<\/code> para que pueda seguir con el m\u00f3dulo 5.<\/span><\/label><\/li>\n<li class=\"task\"><label><input type=\"checkbox\" data-k=\"instructor:8\"><span>Mentores: 1 por cada 10 o 15 asistentes.<\/span><\/label><\/li>\n<\/ul>\n<h2>Puntos donde se atora la gente<\/h2>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>M\u00f3dulo<\/th>\n<th>Problema t\u00edpico<\/th>\n<th>Soluci\u00f3n r\u00e1pida<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td>Regi\u00f3n equivocada<\/td>\n<td>Pide que todos levanten la mano cuando vean \"N. Virginia\".<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Bucket con nombre repetido<\/td>\n<td>El nombre usa el ID de la cuenta, as\u00ed que no deber\u00eda pasar. Si pasa, agrega un sufijo.<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Eligen OpenSearch Serverless<\/td>\n<td>Revisa en pantalla que digan <strong>S3 Vectors<\/strong> antes de hacer clic en Next.<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Olvidan el Sync<\/td>\n<td>Es el paso m\u00e1s olvidado. Rep\u00edtelo dos veces.<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Pierden <code>KB_ID<\/code><\/td>\n<td>Pon el <code>export<\/code> en una slide fija.<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Error de modelo<\/td>\n<td><code>export MODEL_ID=\"us.amazon.nova-lite-v1:0\"<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Demo \"sin RAG\" (gancho de apertura)<\/h2>\n<p>Antes de explicar nada, ejecuta en vivo:<\/p>\n<div class=\"code\" data-lang=\"Terminal\"><div class=\"hl\"><pre><span><\/span>python3<span class=\"w\"> <\/span>05_sin_rag.py<span class=\"w\"> <\/span><span class=\"s2\">&quot;\u00bfCu\u00e1ntos d\u00edas de vacaciones da Cacao Labs el primer a\u00f1o?&quot;<\/span>\n<\/pre><\/div>\n<\/div>\n<p>Luego pregunta al p\u00fablico: <em>\"\u00bfLe creer\u00edan a esta respuesta?\"<\/em>. Al final del m\u00f3dulo 5 repite la misma pregunta con <code>02_rag.py<\/code>. As\u00ed cierras el c\u00edrculo.<\/p>\n<h2>Despu\u00e9s del evento<\/h2>\n<ul>\n<li>Comparte el enlace del repositorio y la encuesta.<\/li>\n<li>Recuerda a quienes usaron su propia cuenta que hagan la <strong>limpieza<\/strong>.<\/li>\n<li>Registra asistencia y aprendizajes para Builder Center.<\/li>\n<\/ul>"}]</script>
<script>
(function(){
  const PAGES = JSON.parse(document.getElementById('pages').textContent);
  const byId = Object.fromEntries(PAGES.map(p => [p.id, p]));
  const MODULES = PAGES.filter(p => p.group === 'Taller');
  const KEY = 'rag-taller-ugc-v1';
  let state = {done:{}, checks:{}};
  try { state = Object.assign(state, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch(e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} };

  const rail = document.getElementById('rail');
  const article = document.getElementById('article');
  const pager = document.getElementById('pager');
  const doneBox = document.getElementById('donebox');
  const doneBtn = document.getElementById('doneBtn');
  const menuBtn = document.getElementById('menuBtn');
  const ORDER = PAGES.map(p => p.id);

  function cleanTitle(t){ return t.replace(/^[^\p{L}\d¿¡]+/u,'').replace(/^\d+\s*·\s*/,''); }
  function esc(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function buildRail(){
    let html = '', group = null, total = 0;
    for (const p of PAGES){
      const g = p.group === 'sub' ? 'Taller' : p.group;
      if (g !== group && g !== 'Inicio'){ html += `<h4>${g === 'Taller' ? 'El taller' : g}</h4>`; }
      if (g === 'Inicio' && group === null) html += `<h4>Empieza aquí</h4>`;
      group = g;
      if (p.group === 'sub'){
        html += `<a class="sub" href="#${p.id}" data-id="${p.id}"><span>${esc(p.label)}</span></a>`;
      } else if (p.num !== null){
        total += p.mins;
        html += `<a href="#${p.id}" data-id="${p.id}"><span class="num">${p.num}</span><span>${esc(p.label)}</span><span class="mins">${p.mins}′</span></a>`;
      } else {
        html += `<a href="#${p.id}" data-id="${p.id}"><span class="num">·</span><span>${esc(p.label)}</span><span></span></a>`;
      }
      if (p.id === 'que-sigue') html += `<div class="total"><span>Duración total</span><span>${Math.floor(total/60)} h${total%60 ? ' ' + total%60 + ' min' : ''}</span></div>`;
    }
    rail.innerHTML = html;
  }

  function refreshProgress(){
    const n = MODULES.filter(m => state.done[m.id]).length;
    document.getElementById('progtext').textContent = `${n} de ${MODULES.length} módulos`;
    document.getElementById('progbar').style.width = (100 * n / MODULES.length) + '%';
    rail.querySelectorAll('a[data-id]').forEach(a => a.classList.toggle('done', !!state.done[a.dataset.id]));
  }

  function addCopyButtons(){
    article.querySelectorAll('.code').forEach(box => {
      const b = document.createElement('button');
      b.className = 'copy'; b.type = 'button'; b.textContent = 'Copiar';
      b.setAttribute('aria-label', 'Copiar código');
      b.addEventListener('click', () => {
        const text = box.querySelector('pre').innerText.replace(/\n$/, '');
        const ok = () => { b.textContent = 'Copiado'; b.classList.add('ok'); setTimeout(() => { b.textContent = 'Copiar'; b.classList.remove('ok'); }, 1600); };
        const fallback = () => { const r = document.createRange(); r.selectNodeContents(box.querySelector('pre')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Seleccionado: ⌘/Ctrl+C'; };
        try { navigator.clipboard.writeText(text).then(ok, fallback); } catch(e) { fallback(); }
      });
      box.appendChild(b);
    });
  }

  function bindChecks(){
    article.querySelectorAll('input[type=checkbox][data-k]').forEach(cb => {
      if (cb.dataset.k in state.checks) cb.checked = state.checks[cb.dataset.k];
      cb.addEventListener('change', () => { state.checks[cb.dataset.k] = cb.checked; save(); });
    });
  }

  function show(id, focus){
    const p = byId[id] || byId.inicio;
    const kindClass = {'Hands-on':'hands','Reto':'hands','Obligatorio':'must'}[p.kind] || '';
    let eyebrow = '';
    if (p.num !== null) eyebrow = `<div class="eyebrow"><span class="chip mod">Módulo ${p.num}</span><span class="chip">${p.mins} min</span><span class="chip ${kindClass}">${p.kind}</span></div>`;
    else if (p.group === 'sub') eyebrow = `<div class="eyebrow"><span class="chip mod">Módulo 0</span><span class="chip">Elige una ruta</span></div>`;
    else if (p.group === 'Recursos') eyebrow = `<div class="eyebrow"><span class="chip">Recursos</span></div>`;
    const title = p.id === 'inicio' ? 'Habla con tus documentos' : cleanTitle(p.title);
    article.innerHTML = eyebrow + `<h1 class="page-title" tabindex="-1">${esc(title)}</h1>` + p.html;
    addCopyButtons(); bindChecks();

    rail.querySelectorAll('a[data-id]').forEach(a => a.toggleAttribute('aria-current', false));
    const cur = rail.querySelector(`a[data-id="${p.id}"]`); if (cur) cur.setAttribute('aria-current', 'page');

    const isModule = p.group === 'Taller';
    doneBox.hidden = !isModule;
    if (isModule){
      const d = !!state.done[p.id];
      doneBtn.setAttribute('aria-pressed', d); doneBtn.textContent = d ? '✓ Completado' : 'Marcar como completado';
      document.getElementById('donetext').textContent = d ? 'Listo. Puedes seguir con el siguiente módulo.' : '¿Terminaste los pasos y el checkpoint de este módulo?';
    }

    const seq = ORDER.filter(x => byId[x].group !== 'Recursos' || x === p.id);
    const i = seq.indexOf(p.id);
    const prev = byId[seq[i-1]], next = byId[seq[i+1]];
    pager.innerHTML = (prev ? `<a href="#${prev.id}"><small>Anterior</small><span>${esc(prev.label)}</span></a>` : '<span></span>') +
                      (next ? `<a class="next" href="#${next.id}"><small>Siguiente</small><span>${esc(next.label)}</span></a>` : '');
    document.title = (p.id === 'inicio' ? '' : p.label + ' · ') + 'Habla con tus documentos';
    window.scrollTo(0, 0);
    if (focus) article.querySelector('h1').focus({preventScroll:true});
    closeMenu();
  }

  doneBtn.addEventListener('click', () => {
    const id = (location.hash || '#inicio').slice(1);
    state.done[id] = !state.done[id]; save(); refreshProgress(); show(id);
  });

  function closeMenu(){ if (window.matchMedia('(max-width:900px)').matches){ rail.hidden = true; menuBtn.setAttribute('aria-expanded','false'); } }
  menuBtn.addEventListener('click', () => { rail.hidden = !rail.hidden; menuBtn.setAttribute('aria-expanded', String(!rail.hidden)); });
  window.matchMedia('(max-width:900px)').addEventListener('change', e => { rail.hidden = e.matches; });

  window.addEventListener('hashchange', () => show(location.hash.slice(1), true));
  buildRail(); refreshProgress();
  rail.hidden = window.matchMedia('(max-width:900px)').matches;
  show((location.hash || '#inicio').slice(1), false);
})();
</script>

</body>
</html>
